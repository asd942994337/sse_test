name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check deploy secrets
        id: check
        run: |
          missing=""
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then missing="$missing DEPLOY_HOST"; fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then missing="$missing DEPLOY_USER"; fi
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then missing="$missing DEPLOY_SSH_KEY"; fi
          if [ -n "$missing" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::缺少 Secrets:$missing —— 跳过部署"
            {
              echo "### ⚠️ 部署已跳过"
              echo ""
              echo "缺少 Secrets:\`$missing\`"
              echo ""
              echo "到 Settings → Secrets and variables → Actions 补齐后，重新运行本工作流。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package
        if: steps.check.outputs.skip != 'true'
        run: |
          tar -czf /tmp/app.tgz \
            --exclude=node_modules \
            --exclude=web/node_modules \
            --exclude=dist \
            --exclude=web/dist \
            --exclude=.git \
            --exclude='*.log' \
            --exclude='.env*' \
            .

      - name: Setup SSH
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || 22 }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload
        if: steps.check.outputs.skip != 'true'
        run: |
          scp -P "${{ secrets.DEPLOY_PORT || 22 }}" /tmp/app.tgz \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/hello-stack.tgz"

      - name: Deploy
        if: steps.check.outputs.skip != 'true'
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT || 22 }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "bash -s /tmp/hello-stack.tgz" < scripts/deploy-remote.sh
