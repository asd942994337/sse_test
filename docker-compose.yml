# 三个容器：web（Nginx 静态 + 反代 /api）→ api（Node）→ db（MySQL）
# 只有 web 暴露到宿主机；api 和 db 都只在内部网络，公网访问不到
name: hello-stack

services:
  db:
    image: mysql:8.0
    container_name: hello-db
    restart: unless-stopped
    # 2G 小机器必须调参：MySQL 8 默认配置会吃掉 400M+ 内存
    command:
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50
      - --skip-name-resolve
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpass_change_me
      MYSQL_DATABASE: hello
      MYSQL_USER: hello
      MYSQL_PASSWORD: hellopass
    ports:
      # 只绑定 127.0.0.1：容器里能连、宿主机本机能连，
      # 公网连不进来（安全组也没开 3306），避免数据库裸奔
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql        # 数据卷：容器删了数据还在
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  api:
    build: .
    container_name: hello-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: hello-stack-api
      PORT: "3000"
      DB_HOST: db            # 容器名即主机名，compose 自带 DNS
      DB_PORT: "3306"
      DB_USER: hello
      DB_PASSWORD: hellopass
      DB_NAME: hello

      # ── 问答（RAG）相关 ──────────────────────────────────────────
      # 生产环境**必须**用这里的变量注入，别用网页上的「⚙ 模型」：
      #   网页配置只存在容器内存 + 容器内的 .rag-config.json 里，
      #   每次 docker compose up --build 重建容器就没了。
      #
      # 用法：在服务器 /opt/hello-stack/.env 里写下面这些（compose 会自动读）
      #     LLM_API_KEY=sk-xxxx
      #     LLM_MODEL=deepseek-chat
      #     SEARCH_PROVIDER=deepseek
      #
      # 注意 .env 已被 .gitignore 和 deploy.ps1 的打包排除，不会进版本库
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      # 搜索源：deepseek 用同一把 key；留空则不联网
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-deepseek}
      # 站内分数低于它就自动联网
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-4}
      RAG_AUTO_WEB: ${RAG_AUTO_WEB:-1}
      # ★ 加密密钥：网页上填的 API Key 用它做 AES-256-GCM 加密后才进数据库
      #   丢了它 → 库里那份密文解不开（重新填即可）
      #   泄露它 → 等于库里的密文失效
      APP_SECRET: ${APP_SECRET:-}

    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy   # 等 MySQL 真正能连了再启动 api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build: ./web            # 多阶段构建：node 打包 → nginx 只放 dist
    container_name: hello-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # 只挂配置，不再挂静态文件：产物已经烤进镜像了
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
    name: hello-stack-mysql-data
