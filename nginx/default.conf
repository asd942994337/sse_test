# Nginx 在容器里，监听 80（由 compose 映射到宿主机的 8080）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS（127.0.0.11）。
    # 关键：容器重建后 IP 会变，而 Nginx 默认只在启动时解析一次 upstream 主机名，
    # 于是会一直往早已消失的旧 IP 发请求 -> 502。用 resolver + 变量强制运行时解析。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 静态资源：SPA 刷新不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 接口反向代理：/api/hello -> http://api:3000/api/hello
    # 用变量写法时，Nginx 会把原始 URI 原样透传（不会吃掉 /api 前缀）
    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 聊天页：静态文件在 api 容器里（Dockerfile 的 COPY public），
    # 所以 /chat 要转给 api，不能走下面的静态 try_files。
    #
    # 注意 SSE：/api/rag/chat 是流式响应，靠两件事保证不被憋住 ——
    #   1. 应用侧回了 X-Accel-Buffering: no，nginx 见到它就关掉缓冲
    #   2. 应用侧每 15 秒发一行心跳注释，远小于上面的 60s read_timeout
    location /chat {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
